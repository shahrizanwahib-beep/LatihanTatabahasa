<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 7 · Ulang Kaji Unit 1–5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ea;color:#16362d;font:17px/1.5 system-ui}header,main{max-width:850px;margin:auto;padding:20px}h1{font-size:clamp(32px,6vw,65px);line-height:1;margin:.3em 0}nav{position:sticky;top:0;background:#153d31;color:white;padding:12px;z-index:2;text-align:center}nav a{color:white;margin:0 .35em;display:inline-block}section{scroll-margin-top:115px}fieldset,article{background:white;border:1px solid #ccd6cd;border-radius:12px;padding:16px;margin:12px 0;min-width:0}legend{font-weight:bold;background:white;padding:0 6px}label.option{display:block;padding:6px;cursor:pointer}textarea,input[type=text]{font:inherit;width:100%;padding:10px;border:1px solid #799084;border-radius:6px}button{background:#164737;color:white;padding:10px 16px;border:0;border-radius:6px;font:inherit;cursor:pointer}#result{scroll-margin-top:110px}.feedback{color:#16593c;font-weight:bold}
fieldset{width:100%;min-inline-size:0}fieldset legend{display:table;float:left;width:100%;max-inline-size:100%;padding:0 0 8px;white-space:normal;overflow-wrap:anywhere}fieldset legend+label{clear:both}label.option,article label{overflow-wrap:anywhere}article label{display:block}textarea{max-width:100%;resize:vertical}</style><header><strong>YEAR 7 · BAHASA MELAYU</strong><h1>Ulang Kaji Unit 1–5</h1><p>Jawab 40 soalan objektif dan taip jawapan bagi 10 soalan subjektif. Draf disimpan dalam pelayar ini.</p></header>
<nav id="nav"></nav><main><form id="quiz"><article><label>Nama murid <input type="text" name="nama" required></label><label>Kelas <input type="text" name="kelas" required></label></article><div id="questions"></div><button type="submit">Semak dan lengkapkan latihan</button></form><article id="result" hidden tabindex="-1"></article></main>
<script>
const groups=[["Ungkapan Masa", [["Latihan bermula pukul 8.45 dan tamat pukul 10.10. Berapa lamakah latihan itu?", "1 jam 25 minit", "1 jam 15 minit", "1 jam 35 minit", "85 saat"], ["Hari ini hari Rabu. Pertandingan diadakan tiga hari lagi. Bilakah pertandingan itu?", "Sabtu", "Jumaat", "Ahad", "Isnin"], ["Apakah waktu bagi pukul sembilan kurang suku malam?", "8.45 malam", "9.15 malam", "9.45 malam", "8.15 malam"], ["“Dua hari yang lalu saya melawat nenek.” Bilakah lawatan itu berlaku?", "Dua hari sebelum hari ini", "Dua hari selepas hari ini", "Kelmarin lusa", "Pada hari ini"], ["Bas bertolak pukul 7.35. Rina perlu tiba 15 minit lebih awal. Pukul berapakah dia perlu tiba?", "7.20", "7.15", "7.25", "7.50"], ["Apakah ayat yang menyatakan tempoh?", "Kami berlatih selama dua jam.", "Kami berlatih pada pukul dua.", "Kami berlatih pada hari Selasa.", "Kami berlatih petang tadi."]]], ["Kesihatan dan Kecergasan", [["Nadia berasa dahaga selepas berjoging. Apakah tindakan yang paling sesuai?", "Minum air kosong", "Menambah kelajuan larian", "Memakai jaket tebal", "Menunggu hingga malam"], ["Mengapakah kita melakukan aktiviti memanaskan badan sebelum bersukan?", "Untuk menyediakan badan sebelum bergerak aktif", "Untuk menggantikan waktu tidur", "Untuk mengelakkan keperluan minum", "Untuk memendekkan waktu rehat selepas bersukan"], ["Apakah maksud “secara berkala” dalam ayat “Dia bersenam secara berkala”?", "Pada selang masa yang tetap", "Hanya sekali", "Sepanjang hari", "Pada bila-bila masa tanpa rutin"], ["Apakah pilihan yang menunjukkan hidangan seimbang?", "Nasi, ikan, sayur dan buah", "Nasi dan mi sahaja", "Biskut dan keropok", "Kek dan air berkarbonat"], ["Apakah tabiat yang membantu murid berehat selepas hari yang sibuk?", "Tidur pada waktu yang tetap", "Bermain permainan hingga lewat malam", "Menggantikan tidur dengan minuman manis", "Belajar tanpa henti sepanjang malam"], ["“Rafi berjalan kaki tiga kali seminggu dan semakin cergas.” Apakah hubungannya?", "Aktiviti fizikal membantu meningkatkan kecergasan.", "Rafi hanya berjalan apabila dia tidak cergas.", "Rafi semakin cergas kerana berhenti berjalan.", "Berjalan kaki ialah aktiviti yang dilakukan setiap hari dalam petikan."]]], ["Keluarga dan Haiwan Peliharaan", [["Apakah hubungan antara kamu dengan adik lelaki ibu kamu?", "Dia bapa saudara kamu.", "Dia datuk kamu.", "Dia sepupu kamu.", "Dia abang kamu."], ["Aina memberi makanan kepada kucing pada pagi hari. Adiknya membersihkan bekas air pada petang hari. Siapakah yang menjaga kebersihan bekas air?", "Adik Aina", "Aina", "Ibu Aina", "Maklumat itu tidak dinyatakan"], ["Apakah tujuan membahagikan tugas menjaga haiwan dalam keluarga?", "Supaya tanggungjawab dapat dikongsi secara teratur", "Supaya setiap orang melakukan tugas yang sama serentak", "Supaya haiwan diberi makan hanya pada hujung minggu", "Supaya satu tugas dilakukan tanpa jadual"], ["Yang manakah menunjukkan penjagaan haiwan secara bertanggungjawab?", "Memastikan bekas air bersih dan berisi", "Membiarkan bekas air kosong sepanjang hari", "Memberi makanan tanpa memeriksa bekasnya", "Membersihkan bekas hanya apabila haiwan sakit"], ["“Datuk menyimpan makanan arnab di tempat yang kering.” Apakah maklumat yang diberi?", "Tempat makanan disimpan", "Waktu arnab diberi makan", "Jenis makanan arnab", "Bilangan arnab yang dipelihara"], ["Lina perlu pergi bercuti. Apakah maklumat paling berguna untuk penjaga kucingnya?", "Jadual makan dan tempat bekas air", "Warna beg perjalanan Lina", "Nama hotel yang ditempah", "Harga tiket perjalanan"]]], ["Rumah dan Kehidupan Tempat Tinggal", [["Keluarga Faris mempunyai tiga orang anak dan nenek tinggal bersama mereka. Rumah manakah yang paling memenuhi keperluan ruang tidur?", "Rumah dengan empat bilik tidur", "Rumah satu bilik dengan halaman luas", "Rumah dua bilik dengan dapur baharu", "Rumah satu bilik berdekatan pasar"], ["Ruang manakah paling sesuai untuk menerima tetamu?", "Ruang tamu", "Bilik air", "Stor", "Bilik tidur"], ["“Dapur terletak di antara ruang makan dengan halaman.” Apakah yang diterangkan?", "Kedudukan dapur", "Saiz dapur", "Peralatan dapur", "Keadaan dapur"], ["Mengapakah keluarga yang tidak memiliki kereta mungkin memilih rumah berhampiran perhentian bas?", "Mereka mudah menggunakan pengangkutan awam.", "Mereka boleh meletakkan banyak kereta.", "Mereka akan memperoleh bilik tambahan.", "Mereka boleh membesarkan halaman."], ["Apakah maksud “rumah itu mempunyai pengudaraan yang baik”?", "Udara dapat mengalir dengan baik di dalam rumah.", "Rumah itu mempunyai banyak perabot.", "Rumah itu berada di kawasan yang tinggi.", "Udara hanya masuk melalui pintu utama."], ["Dua rumah mempunyai saiz yang sama. Rumah A berhampiran sekolah. Rumah B jauh dari sekolah. Apakah kelebihan Rumah A untuk murid?", "Perjalanan ke sekolah lebih singkat.", "Biliknya lebih luas.", "Halaman rumahnya lebih besar.", "Sekolahnya terletak lebih jauh."]]], ["Kawasan Tempat Tinggal dan Kemudahan Awam", [["Kamu mahu meminjam buku rujukan. Kemudahan manakah yang paling sesuai?", "Perpustakaan awam", "Pejabat pos", "Dewan orang ramai", "Balai polis"], ["Apakah perkhidmatan yang boleh kamu gunakan di pejabat pos?", "Menghantar bungkusan", "Meminjam buku", "Mendapatkan rawatan", "Melaporkan kehilangan dompet"], ["Penduduk hendak menganjurkan mesyuarat yang dihadiri ramai orang. Kemudahan manakah paling sesuai?", "Dewan orang ramai", "Perhentian bas", "Kaunter hospital", "Lintasan pejalan kaki"], ["Mengapakah lampu jalan dekat perhentian bas perlu dibaiki?", "Supaya pengguna dapat melihat dengan jelas pada waktu malam.", "Supaya bas boleh membawa lebih ramai penumpang.", "Supaya tiket bas menjadi lebih murah.", "Supaya jalan menjadi lebih lebar."], ["Apakah cadangan yang sesuai untuk mengurangkan sampah di taman?", "Sediakan tong sampah di tempat yang mudah dicapai.", "Tambah papan tanda nama jalan.", "Pindahkan kerusi ke kawasan teduh.", "Bina laluan masuk yang lebih lebar."], ["Seseorang memerlukan rawatan daripada doktor pakar. Kemudahan manakah paling sesuai?", "Hospital", "Balai polis", "Pejabat pos", "Perpustakaan"]]], ["Tatabahasa", [["Yang manakah kata nama khas?", "Taman Seri Indah", "taman permainan", "jalan utama", "dewan masyarakat"], ["Dalam ayat “Penduduk membersihkan taman pada hari Ahad”, apakah kata kerja?", "membersihkan", "penduduk", "taman", "Ahad"], ["Kami berjalan ___ rumah ke perhentian bas.", "dari", "daripada", "kepada", "pada"], ["Cadangan itu datang ___ ketua penduduk.", "daripada", "dari", "di", "ke"], ["Pilih ayat yang menggunakan kata sendi “di” dengan betul.", "Kucing itu tidur di bawah meja.", "Kucing itu tidur dibawah meja.", "Kucing itu tidur ke bawah meja.", "Kucing itu tidur daripada bawah meja."], ["Pilih ayat yang menggunakan imbuhan awalan di- dengan betul.", "Buku itu dipinjam oleh Hana.", "Buku itu di pinjam oleh Hana.", "Buku itu di-pinjam oleh Hana.", "Buku itu di pinjamkan oleh Hana."], ["Siti memasang lampu ___ kawasan itu lebih terang.", "supaya", "tetapi", "atau", "kerana"], ["Kami mahu berlari di taman, ___ hujan turun dengan lebat.", "tetapi", "supaya", "atau", "sambil"], ["Kakak membaca buku ___ menunggu bas.", "sambil", "supaya", "kerana", "tetapi"], ["Pilih ayat dengan penjodoh bilangan yang betul.", "Ayah membeli dua ekor arnab.", "Ayah membeli dua buah arnab.", "Ayah membeli dua batang arnab.", "Ayah membeli dua orang arnab."]]]];
const writing=[["Kelas bermula pukul 8.20 dan berakhir pukul 9.05. Tulis satu ayat yang menyatakan tempohnya.", "Kelas itu berlangsung selama 45 minit."], ["Tulis dua ayat tentang rutin hujung minggu. Nyatakan waktu mula pada ayat pertama dan tempoh aktiviti pada ayat kedua.", "Saya mula berjoging pada pukul tujuh pagi. Saya berjoging selama setengah jam."], ["Tulis dua cadangan untuk kekal cergas. Terangkan sebab bagi satu cadangan.", "Kita boleh berjalan kaki setiap petang. Kita perlu tidur secukupnya supaya badan dapat berehat."], ["Rakan kamu selalu tidur lewat dan letih di sekolah. Tulis satu nasihat berserta sebab.", "Kamu patut tidur lebih awal supaya kamu lebih segar di sekolah."], ["Terangkan cara dua ahli keluarga boleh berkongsi tugas menjaga kucing. Tulis satu ayat bagi setiap orang.", "Saya memberi kucing makanan setiap pagi. Adik saya membersihkan bekas airnya setiap petang."], ["Bandingkan dua ruang di rumah kamu. Nyatakan satu kegunaan bagi setiap ruang.", "Kami memasak di dapur. Kami menerima tetamu di ruang tamu."], ["Cadangkan satu ciri rumah yang sesuai untuk keluarga yang ada anak kecil. Beri satu sebab.", "Saya mencadangkan rumah yang mempunyai halaman berpagar supaya anak-anak boleh bermain di luar dengan selamat."], ["Taman di kawasan kamu kotor. Tulis dua ayat yang menyatakan satu masalah dan satu cadangan.", "Sampah bertaburan di taman. Pihak berkuasa boleh menyediakan lebih banyak tong sampah."], ["Betulkan dua kesalahan dalam ayat ini. “Saya belajar diruang tamu sebelum pergi keperpustakaan.”", "Saya belajar di ruang tamu sebelum pergi ke perpustakaan."], ["Gabungkan dua ayat dengan “supaya”. “Penduduk membaiki lampu jalan. Kawasan itu lebih terang pada waktu malam.”", "Penduduk membaiki lampu jalan supaya kawasan itu lebih terang pada waktu malam."]];
const form=document.querySelector('#quiz'), questions=document.querySelector('#questions'), result=document.querySelector('#result');
const objective=groups.flatMap(([,items])=>items);
let number=0;
function choices(item,index){
 const [question,...answers]=item;
 const turn=(index*7+Math.floor(index/4))%4;
 const rotated=answers.slice(turn).concat(answers.slice(0,turn));
 return '<fieldset><legend>'+(index+1)+'. '+question+'</legend>'+rotated.map(answer=>'<label class="option"><input required type="radio" name="q'+index+'" value="'+answers.indexOf(answer)+'"> '+answer+'</label>').join('')+'</fieldset>';
}
questions.innerHTML=groups.map(([name,items],index)=>'<section id="g'+index+'"><h2>'+name+'</h2>'+items.map(item=>choices(item,number++)).join('')+'</section>').join('')+'<section id="subjective"><h2>Subjektif</h2>'+writing.map(([question],index)=>'<article><label for="s'+index+'">'+(41+index)+'. '+question+'</label><textarea required rows="3" id="s'+index+'" name="s'+index+'"></textarea></article>').join('')+'</section>';
document.querySelector('#nav').innerHTML=groups.map((_,i)=>'<a href="#g'+i+'">'+(i===5?'Tatabahasa':'Unit '+(i+1))+'</a>').join('')+' <a href="#subjective">Subjektif</a> <span id="progress"></span>';
const storageKey='year7-units1to5-v1';
try{
 const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');
 for(const [name,value] of Object.entries(saved)){
  const field=form.elements.namedItem(name);
  if(field)field.value=value;
 }
}catch{}
function update(){
 const values=Object.fromEntries(new FormData(form));
 const answered=Object.entries(values).filter(([name,value])=>/^[qs]\d+$/.test(name)&&value.trim()).length;
 document.querySelector('#progress').textContent=answered+' / 50';
 try{localStorage.setItem(storageKey,JSON.stringify(values))}catch{}
}
form.addEventListener('input',()=>{result.hidden=true;update()});
form.addEventListener('submit',async event=>{
 event.preventDefault();
 for(const field of form.querySelectorAll('textarea,input[type=text]')){
  if(!field.value.trim()){field.focus();return}
 }
 const values=new FormData(form);
 const score=objective.reduce((sum,_,i)=>sum+Number(values.get('q'+i)==='0'),0);
 result.innerHTML='<p class="feedback">50 daripada 50 soalan dijawab</p><p id="identity"></p>'+'<h2>Objektif '+score+' / 40</h2><p>Jawapan subjektif tersedia untuk semakan guru. Ambil tangkapan skrin keputusan ini.</p><button id="download">Muat turun jawapan</button><details><summary>Semak jawapan objektif</summary><ol>'+objective.map((item,i)=>'<li>'+item[1]+(values.get('q'+i)==='0'?' ✓':'')+'</li>').join('')+'</ol></details>';
 document.querySelector('#identity').textContent=values.get('nama')+' · '+values.get('kelas');
 document.querySelector('#download').onclick=()=>{
  const report=['Nama: '+values.get('nama'),'Kelas: '+values.get('kelas'),'Objektif: '+score+'/40','',...objective.map((item,i)=>(i+1)+'. '+item[1+Number(values.get('q'+i))]),'',...writing.map(([q],i)=>(41+i)+'. '+q+'\n'+values.get('s'+i))].join('\n');
  const url=URL.createObjectURL(new Blob([report],{type:'text/plain;charset=utf-8'}));
  const link=document.createElement('a');link.href=url;link.download='jawapan-year7.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 };
 result.hidden=false;result.focus();result.scrollIntoView();
});
update();
</script></html>
